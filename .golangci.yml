version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck and unused.
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        # A handler can do nothing about a client that hung up.
        - (net/http.ResponseWriter).Write
  exclusions:
    presets:
      # Unchecked Close and RemoveAll, as in a defer.
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
