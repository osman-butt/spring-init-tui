# GoReleaser builds the release archives when a v* tag is pushed
# (see .github/workflows/release.yml). Try it locally without publishing:
#
#   goreleaser release --snapshot --clean
version: 2

project_name: spring-init-tui

builds:
  - id: si
    main: ./cmd/si
    binary: si
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # Same input, same binary: use the commit time instead of the build time.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

# Publishes Casks/si.rb to the tap, so that this works:
#
#   brew install osman-butt/tap/si
homebrew_casks:
  - name: si
    repository:
      owner: osman-butt
      name: homebrew-tap
      # The workflow's own token cannot write to another repository.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/osman-butt/spring-init-tui
    description: Terminal UI for Spring Initializr
    binaries:
      - si
    hooks:
      post:
        # The binary is not signed, so macOS would block it while the
        # quarantine flag that Homebrew sets on casks is still there.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/si"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
