# GoReleaser builds the release archives when a v* tag is pushed
# (see .github/workflows/release.yml). Try it locally without publishing:
#
#   goreleaser release --snapshot --clean
version: 2

project_name: spring-init-tui

builds:
  - id: si
    main: ./cmd/si
    binary: si
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # Same input, same binary: use the commit time instead of the build time.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

# Debian packages. The release workflow lists them in the apt repository on
# GitHub Pages (see scripts/apt-repo.sh), so that this works:
#
#   sudo apt install si
nfpms:
  - id: si
    package_name: si
    ids: [si]
    formats: [deb]
    bindir: /usr/bin
    section: devel
    maintainer: Osman Butt <butt.osman@gmail.com>
    homepage: https://github.com/osman-butt/spring-init-tui
    description: Terminal UI for Spring Initializr
    license: MIT
    contents:
      - src: LICENSE
        dst: /usr/share/doc/si/copyright

checksum:
  name_template: checksums.txt

# Publishes Casks/si.rb to the tap, so that this works:
#
#   brew install osman-butt/tap/si
homebrew_casks:
  - name: si
    repository:
      owner: osman-butt
      name: homebrew-tap
      # The workflow's own token cannot write to another repository.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/osman-butt/spring-init-tui
    description: Terminal UI for Spring Initializr
    binaries:
      - si
    # The binary is not signed, so macOS would block it while the quarantine
    # flag that Homebrew sets on casks is still there. GoReleaser's own hook
    # (hooks.post.install) writes a `postflight do` block, which Homebrew 7
    # deprecates, so the `postflight_steps` stanza is written by hand. Steps
    # run in the directory the cask was unpacked into.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "si"], chdir: "."
        end
      end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^Merge "
